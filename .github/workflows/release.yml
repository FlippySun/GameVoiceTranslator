name: Release

# 在 GitHub 上发布 Release 后，自动构建安装包并上传到这个 Release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 要上传安装包的 Release 标签（例如 v1.0.0）
        required: true

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test tests/GVT.Tests -c Release
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build installer
        shell: pwsh
        run: ./installer/build-installer.ps1
      - name: Upload to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Get-ChildItem installer/output/*.exe | ForEach-Object { gh release upload $env:TAG $_.FullName --clobber }
